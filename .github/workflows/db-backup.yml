name: DB backup

on:
  schedule:
    # GitHub cron is UTC. 21:30 UTC = 03:00 IST.
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      MYSQL_PWD: ${{ secrets.DB_PASSWORD }}
      AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client age

      - name: Dump, verify, encrypt
        run: |
          set -euo pipefail

          STAMP=$(date -u +%Y-%m-%d_%H%M)
          FILE="ambika-${STAMP}.sql.gz"

          mysqldump -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" \
            --ssl-mode=REQUIRED --single-transaction --routines --no-tablespaces \
            "$DB_NAME" | gzip > "$FILE"

          # Refuse to store an empty or broken dump.
          SIZE=$(stat -c%s "$FILE")
          if [ "$SIZE" -lt 1024 ]; then
            echo "Dump is only ${SIZE} bytes, something is wrong."
            exit 1
          fi
          TABLES=$(zcat "$FILE" | grep -c "CREATE TABLE" || true)
          if [ "$TABLES" -lt 1 ]; then
            echo "Dump contains no CREATE TABLE statements."
            exit 1
          fi
          echo "Dump OK: ${SIZE} bytes, ${TABLES} tables."

          # Encrypt before it is stored anywhere.
          mkdir -p out
          age -r "$AGE_PUBLIC_KEY" -o "out/${FILE}.age" "$FILE"
          rm "$FILE"
          ls -l out

      # Stored as a GitHub Actions artifact (private to your repo, encrypted with age).
      # GitHub keeps artifacts for at most 90 days, then deletes them.
      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: out/*.age
          retention-days: 90
          if-no-files-found: error
